name: Back-end tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: django

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - run: python -m pip install --upgrade pip -r ./requirements.txt
      - run: ruff check

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: django

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - run: python -m pip install --upgrade pip -r ./requirements.txt
      - run: coverage run ./manage.py test
      - run: coverage report
