name: Build Metro2 Docker images

on:
  pull_request:
  push:
    branches:
      - update/dockerfiles
      # - main
  merge_group:

jobs:
  build-front-end-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: cfpb/actions/docker-build-push@5b3ff0ebe0ac88a69752a6e0fff1b73a2f6ebcf9
        with:
          image-name: metro2-frontend-builder
          context: ./front-end
          target: builder
          token: ${{ secrets.GITHUB_TOKEN }}

  build-back-end-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: cfpb/actions/docker-build-push@5b3ff0ebe0ac88a69752a6e0fff1b73a2f6ebcf9
        with:
          image-name: metro2-backend-base
          context: ./django
          target: base
          token: ${{ secrets.GITHUB_TOKEN }}
